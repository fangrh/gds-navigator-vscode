}

// ============================================================
// Handle messages from extension
// ============================================================
window.addEventListener('message', function(event) {
    var message = event.data;
    switch (message.type) {
        case 'ping':
            // Respond to extension polling
            if (vscode) vscode.postMessage({ type: 'webviewReady' });
            else if (window.parent !== window) window.parent.postMessage({ type: 'webviewReady' }, '*');
            break;
        case 'loadGds':
            onRebuildComplete();
            loadGdsData(
                message.geojson,
                message.gdsPath,
                message.pythonFile || '',
                message.annotations || [],
                message.mode
            );
            break;
        case 'setMode':
            currentMode2 = message.mode;
            updateModeIndicator(message.mode);
            break;
        case 'rebuildError':
            onRebuildComplete();
            break;
        case 'selectBySource':
            _selectFeaturesBySource((message.file || '').replace(/\\/g, '/'), message.line);
            break;
        case 'requestYaml':
            // Triggered by the "GDS: Copy Selection as YAML" command —
            // copies via exportYaml -> extension clip.exe path.
            try {
                copyYAML({ stopPropagation: function () {} });
                vscode && vscode.postMessage({ type: 'debugInfo', where: 'requestYaml', message: 'copyYAML returned without throwing' });
            } catch (err) {
                vscode && vscode.postMessage({ type: 'debugError', where: 'requestYaml', message: String((err && err.message) || err) });
            }
            break;
        case 'loadImage':
            try {
                insertMicroImage(message.dataUrl, message.fileName || 'image');
            } catch (err) {
                vscode && vscode.postMessage({ type: 'debugError', where: 'loadImage', message: String((err && err.message) || err) });
            }
            break;
    }
});

// ============================================================
// Microscope image overlay + fully automatic edge-based alignment
// ============================================================
var microImg = null;   // {img: HTMLImageElement, name, cx, cy, umPerPx, rotDeg, opacity}
var microLayer = null; // ol.layer.Image (recreated on transform change)
var imgMoveMode = false;

function imgStatus(text) {
    var overlay = document.getElementById('rebuild-overlay');
    if (!overlay) return;
    if (!text) { overlay.classList.remove('visible'); return; }
    overlay.classList.add('visible');
    overlay.innerHTML = '<div class="spinner"></div>' + text;
}

function insertMicroImage(dataUrl, name) {
    var img = new Image();
    img.onload = function () {
        var ext = map.getView().calculateExtent(map.getSize());
        var wUm = (ext[2] - ext[0]) * 0.6;
        microImg = {
            img: img,
            name: name,
            cx: (ext[0] + ext[2]) / 2,
            cy: (ext[1] + ext[3]) / 2,
            umPerPx: wUm / img.naturalWidth,
            rotDeg: 0,
            opacity: 0.55
        };
        renderMicroLayer();
        vscode && vscode.postMessage({
            type: 'imageTransform',
            fileName: name,
            cx: round2(microImg.cx), cy: round2(microImg.cy),
            umPerPx: round4(microImg.umPerPx), rotDeg: 0,
            note: 'inserted at view center — run auto-align'
        });
    };
    img.onerror = function () {
        vscode && vscode.postMessage({ type: 'debugError', where: 'insertMicroImage', message: 'browser could not decode ' + name + ' (convert TIFF to PNG/JPG first)' });
    };
    img.src = dataUrl;
}

function round2(v) { return Math.round(v * 100) / 100; }
function round4(v) { return Math.round(v * 10000) / 10000; }

/** Recreate the OL image layer from the current transform (rotation is baked
 *  into an offscreen canvas because ImageStatic is axis-aligned). */
function renderMicroLayer() {
    if (!microImg) return;
    if (microLayer) {
        map.removeLayer(microLayer);
        microLayer = null;
    }
    var img = microImg.img;
    var rad = microImg.rotDeg * Math.PI / 180;
    var cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    var wPx = Math.ceil(img.naturalWidth * cos + img.naturalHeight * sin);
    var hPx = Math.ceil(img.naturalWidth * sin + img.naturalHeight * cos);
    var cv = document.createElement('canvas');
    cv.width = wPx; cv.height = hPx;
    var ctx = cv.getContext('2d');
    ctx.translate(wPx / 2, hPx / 2);
    ctx.rotate(rad);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    var wUm = wPx * microImg.umPerPx, hUm = hPx * microImg.umPerPx;
    microLayer = new ol.layer.Image({
        source: new ol.source.ImageStatic({
            imageExtent: [microImg.cx - wUm / 2, microImg.cy - hUm / 2, microImg.cx + wUm / 2, microImg.cy + hUm / 2],
            url: cv.toDataURL('image/png')
        }),
        opacity: microImg.opacity,
        zIndex: 10
    });
    map.addLayer(microLayer);
}

function reportTransform(note) {
    if (!microImg || !vscode) return;
    vscode.postMessage({
        type: 'imageTransform',
        fileName: microImg.name,
        cx: round2(microImg.cx), cy: round2(microImg.cy),
        umPerPx: round4(microImg.umPerPx), rotDeg: round2(microImg.rotDeg),
        note: note || ''
    });
}

// ---- manual adjustment (img-move mode) ----
(function () {
    var dragging = false, lastPx = null;
    map.on('pointerdown', function (e) {
        if (!imgMoveMode || !microImg) return;
        dragging = true; lastPx = e.pixel;
    });
    map.on('pointermove', function (e) {
        if (!dragging || !microImg) return;
        var dxPx = e.pixel[0] - lastPx[0], dyPx = e.pixel[1] - lastPx[1];
        lastPx = e.pixel;
        var res = map.getView().getResolution();
        microImg.cx += dxPx * res;
        microImg.cy -= dyPx * res;
        renderMicroLayer();
    });
    map.on('pointerup', function () {
        if (dragging) { dragging = false; reportTransform('moved'); }
    });
    map.getViewport().addEventListener('wheel', function (e) {
        if (!imgMoveMode || !microImg) return;
        e.preventDefault();
        var f = e.deltaY < 0 ? 1.05 : 1 / 1.05;
        microImg.umPerPx /= f;
        renderMicroLayer();
        reportTransform('scale ' + round4(microImg.umPerPx) + ' um/px');
    }, { passive: false, capture: true });
})();

function nudgeMicroImage(dxUm, dyUm) {
    if (!microImg) return;
    microImg.cx += dxUm; microImg.cy += dyUm;
    renderMicroLayer();
    reportTransform('nudged');
}

function rotateMicroImage(deg) {
    if (!microImg) return;
    microImg.rotDeg += deg;
    renderMicroLayer();
    reportTransform('rotated');
}


// ============================================================
// Marker-pitch prior: microscope photos of marker-grid chips have a strong
// periodicity. Measuring it in the photo (edge autocorrelation) and in the
// layout (nearest-neighbour histogram) solves the SCALE directly, and a
// tiled translation search handles small FOVs that exceed the canvas cap.
// ============================================================

/** Dominant grid pitch (um) among square-ish layout features. */
function estimateLayoutPitch() {
    var pts = [];
    allFeatures.forEach(function (f) {
        if (f.get('isDrawn') || f.get('visible') === false) return;
        var e = f._extentCache || (f._extentCache = f.getGeometry().getExtent());
        var w = e[2] - e[0], h = e[3] - e[1];
        if (Math.abs(w - h) < Math.max(2, 0.2 * w) && w < 120) {
            pts.push([(e[0] + e[2]) / 2, (e[1] + e[3]) / 2]);
        }
    });
    if (pts.length < 20) return null;
    var hist = {};
    var stepN = Math.min(pts.length, 400);
    for (var i = 0; i < stepN; i++) {
        var best = 1e9;
        for (var j = 0; j < stepN; j++) {
            if (i === j) continue;
            var dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < best) best = d;
        }
        if (best > 15 && best < 3000) {
            var k = Math.round(best / 10) * 10;
            hist[k] = (hist[k] || 0) + 1;
        }
    }
    var bestK = null, bestC = 0;
    for (var kk in hist) {
        if (hist[kk] > bestC) { bestC = hist[kk]; bestK = +kk; }
    }
    return bestC >= stepN * 0.4 ? bestK : null;
}

/** Dominant periodicity (px) of the photo's edge map, via 1-D autocorrelation
 *  of the row- and column-projections. Returns null when no clear peak. */
function estimateImagePitch() {
    var img = microImg.img;
    var W = 1024;
    var H = Math.max(32, Math.round(W * img.naturalHeight / img.naturalWidth));
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    var d = ctx.getImageData(0, 0, W, H).data;
    var gray = new Float32Array(W * H);
    var i, p;
    for (i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    }
    // Sobel magnitude bitmap
    var E = new Uint8Array(W * H);
    var x, y;
    for (y = 1; y < H - 1; y++) {
        for (x = 1; x < W - 1; x++) {
            var idx = y * W + x;
            var gx2 = (gray[idx - W + 1] + 2 * gray[idx + 1] + gray[idx + W + 1]) -
                      (gray[idx - W - 1] + 2 * gray[idx - 1] + gray[idx + W - 1]);
            var gy2 = (gray[idx + W - 1] + 2 * gray[idx + W] + gray[idx + W + 1]) -
                      (gray[idx - W - 1] + 2 * gray[idx - W] + gray[idx - W + 1]);
            if (Math.sqrt(gx2 * gx2 + gy2 * gy2) > 60) E[idx] = 1;
        }
    }
    function pitchOfAxis(proj) {
        var n = proj.length, mean = 0, j;
        for (j = 0; j < n; j++) mean += proj[j];
        mean /= n;
        var v = new Float32Array(n);
        for (j = 0; j < n; j++) v[j] = proj[j] - mean;
        var var0 = 0;
        for (j = 0; j < n; j++) var0 += v[j] * v[j];
        function ac(lag) {
            var acc = 0;
            for (var k = 0; k + lag < n; k++) acc += v[k] * v[k + lag];
            return acc / (n - lag);
        }
        // first LOCAL maximum (over +/-4 lags) exceeding 30% of the zero-lag
        // variance — the unit-cell pitch, ignoring its multiples
        for (var lag = 6; lag < n / 2; lag++) {
            var a = ac(lag);
            if (a < 0.30 * var0 / n) continue;
            var isMax = true;
            for (var d = -4; d <= 4; d++) {
                if (d !== 0 && lag + d >= 6 && ac(lag + d) > a) { isMax = false; break; }
            }
            if (isMax) return lag;
        }
        return -1;
    }
    var rowProj = new Float32Array(W), colProj = new Float32Array(H);
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
        if (E[y * W + x]) { rowProj[x] += 1; colProj[y] += 1; }
    }
    var px = pitchOfAxis(rowProj), py = pitchOfAxis(colProj);
    if (px < 0 && py < 0) return null;
    var cands = [px, py].filter(function (v) { return v > 0; });
    cands.sort(function (a, b) { return a - b; });
    return cands[0]; // smallest strong period = unit cell pitch
}

// ============================================================
// Automatic edge-based registration
// ============================================================

/** Layout edge bitmap over `region` [minx,miny,maxx,maxy] um at `w x h` px. */
function layoutEdgeMap(region, w, h) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    var rx = region[0], ry = region[1];
    var sx = w / (region[2] - region[0]), sy = h / (region[3] - region[1]);
    allFeatures.forEach(function (f) {
        var g = f.getGeometry();
        if (!g || f.get('isDrawn')) return;
        if (f.get('visible') === false) return; // layer hidden in the legend = not an alignment reference
        // cheap bbox reject: full-chip layouts have 100k+ features, a local
        // refine region only intersects a small fraction of them
        var fe = f._extentCache || (f._extentCache = g.getExtent());
        if (fe[2] < region[0] || fe[0] > region[2] || fe[3] < region[1] || fe[1] > region[3]) return;
        var ring = g.getCoordinates()[0];
        if (!ring || ring.length < 3) return;
        ctx.beginPath();
        ring.forEach(function (p, i) {
            var X = (p[0] - rx) * sx, Y = h - (p[1] - ry) * sy;
            if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        });
        ctx.closePath();
        ctx.stroke();
    });
    var d = ctx.getImageData(0, 0, w, h).data;
    var L = new Uint8Array(w * h);
    for (var i = 0, p = 0; i < L.length; i++, p += 4) {
        if (d[p] > 96) L[i] = 1;
    }
    return L;
}

/** Sobel edge points of the micro image drawn into the region canvas with the
 *  given candidate transform. Returns a flat [x0,y0,x1,y1,...] px array. */
function imageEdgePoints(region, w, h, cx, cy, umPerPx, rotDeg, maxPts) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    var img = microImg.img;
    var k = umPerPx * (w / (region[2] - region[0])); // image px -> canvas px
    ctx.translate((cx - region[0]) / (region[2] - region[0]) * w,
                  h - (cy - region[1]) / (region[3] - region[1]) * h);
    ctx.rotate(rotDeg * Math.PI / 180);
    ctx.scale(k, k);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    var d = ctx.getImageData(0, 0, w, h).data;
    var gray = new Float32Array(w * h);
    var i, p;
    for (i = 0, p = 0; i < gray.length; i++, p += 4) {
        gray[i] = d[p + 3] > 100 ? 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2] : -1;
    }
    // Sobel magnitude + adaptive threshold (keep strongest 10%)
    var mags = [];
    var mag = new Float32Array(w * h);
    var gxArr = new Float32Array(w * h);
    var gyArr = new Float32Array(w * h);
    var x, y, idx;
    for (y = 1; y < h - 1; y++) {
        for (x = 1; x < w - 1; x++) {
            idx = y * w + x;
            var a = gray[idx - w - 1], b = gray[idx - w], c = gray[idx - w + 1];
            var dd = gray[idx - 1], ff = gray[idx + 1];
            var g1 = gray[idx + w - 1], g2 = gray[idx + w], g3 = gray[idx + w + 1];
            if (a < 0 || c < 0 || g1 < 0 || g3 < 0 || dd < 0 || ff < 0) continue;
            var gx = (c + 2 * ff + g3) - (a + 2 * dd + g1);
            var gy = (g1 + 2 * g2 + g3) - (a + 2 * b + c);
            var m = Math.sqrt(gx * gx + gy * gy);
            mag[idx] = m;
            gxArr[idx] = gx; gyArr[idx] = gy;
            if (m > 0) mags.push(m);
        }
    }
    if (!mags.length) return new Int16Array(0);
    // O(n) bucket select for the 90th-percentile threshold (sort was a
    // hotspot: the array holds every gradient pixel of the canvas)
    var hist = new Uint32Array(1024);
    var mmax = 0, mi;
    for (mi = 0; mi < mags.length; mi++) if (mags[mi] > mmax) mmax = mags[mi];
    for (mi = 0; mi < mags.length; mi++) hist[Math.min(1023, (mags[mi] / (mmax || 1) * 1023) | 0)]++;
    var want = Math.floor(mags.length * 0.10), acc = 0, bi = 1023;
    for (; bi >= 0; bi--) { acc += hist[bi]; if (acc >= want) break; }
    var thr = (bi / 1023) * (mmax || 1);
    // Non-maximum suppression along the gradient direction: keeps one-pixel
    // wide edges (downsampling would otherwise double every stroke edge).
    var pts = [];
    for (y = 1; y < h - 1; y++) {
        for (x = 1; x < w - 1; x++) {
            idx = y * w + x;
            var mm = mag[idx];
            if (mm < thr) continue;
            var gxa = gxArr[idx], gya = gyArr[idx];
            var dIdx;
            if (Math.abs(gxa) > 2 * Math.abs(gya)) dIdx = 1;        // E-W
            else if (Math.abs(gya) > 2 * Math.abs(gxa)) dIdx = w;   // N-S
            else if ((gxa > 0) === (gya > 0)) dIdx = w + 1;         // diag
            else dIdx = w - 1;                                      // anti-diag
            if (mm >= mag[idx - dIdx] && mm >= mag[idx + dIdx]) pts.push(x, y);
        }
    }
    // append gradient-orientation bucket (0..3, 45-deg sectors) per point so
    // the scorer can demand direction agreement, not just proximity
    var out = [];
    for (var q = 0; q < pts.length; q += 2) {
        var qi = pts[q + 1] * w + pts[q];
        var gxa = gxArr[qi], gya = gyArr[qi];
        var sector = Math.round(Math.atan2(gya, gxa) / (Math.PI / 4));
        var b = ((sector % 4) + 4) % 4;
        out.push(pts[q], pts[q + 1], b);
    }
    var stride = Math.max(1, Math.floor(out.length / 3 / (maxPts || 6000)));
    var out2 = [];
    for (var q2 = 0; q2 < out.length; q2 += 3 * stride) out2.push(out[q2], out[q2 + 1], out[q2 + 2]);
    return new Int16Array(out2);
}

/** Two-pass chamfer distance transform of the binary layout map: D[p] is
 *  the distance (px) to the nearest layout edge. Enables smooth, sub-pixel
 *  sensitive alignment scoring (binary hit/miss cannot resolve <1% scale
 *  errors, which drift markers by a full pitch at the FOV edges). */
function layoutDistMap(L, w, h) {
    var INF = 1e9;
    var D = new Float32Array(w * h);
    var i, x, y;
    for (i = 0; i < D.length; i++) D[i] = L[i] ? 0 : INF;
    var D2 = Math.SQRT2;
    // forward pass
    for (y = 0; y < h; y++) {
        for (x = 0; x < w; x++) {
            i = y * w + x;
            var v = D[i];
            if (x > 0) v = Math.min(v, D[i - 1] + 1);
            if (y > 0) {
                v = Math.min(v, D[i - w] + 1);
                if (x > 0) v = Math.min(v, D[i - w - 1] + D2);
                if (x < w - 1) v = Math.min(v, D[i - w + 1] + D2);
            }
            D[i] = v;
        }
    }
    // backward pass
    for (y = h - 1; y >= 0; y--) {
        for (x = w - 1; x >= 0; x--) {
            i = y * w + x;
            var v2 = D[i];
            if (x < w - 1) v2 = Math.min(v2, D[i + 1] + 1);
            if (y < h - 1) {
                v2 = Math.min(v2, D[i + w] + 1);
                if (x < w - 1) v2 = Math.min(v2, D[i + w + 1] + D2);
                if (x > 0) v2 = Math.min(v2, D[i + w - 1] + D2);
            }
            D[i] = v2;
        }
    }
    return D;
}

/** Smooth TRIMMED alignment score in [0,1]: bilinear-sampled chamfer
 *  distance with a cut-off kernel. Points farther than D_CUT px from any
 *  layout edge get weight exactly 0 — photo content that does not exist in
 *  the layout (2D-material flakes, contamination, bubbles) is excluded from
 *  the fit instead of biasing it. meanDist is over INLIERS only, and
 *  inlierFrac says how much of the photo the layout actually explains. */
var CHAMFER_D_CUT = 3.0;
var CHAMFER_SIGMA = 0.7; // px — peaked kernel: exact matches score ~1,
                         // accidental 2px-off hits score ~0.02

/** pts is either [x0,y0,x1,y1,...] (coarse) or [x0,y0,b0, x1,y1,b1,...]
 *  triples whose b = gradient-orientation bucket (refine). D is either a
 *  single Float32 DT or an array of 4 (one per orientation bucket). */
function scoreChamfer(D, w, h, pts, dx, dy, sigma) {
    var oriented = Array.isArray(D);
    var stride = oriented ? 3 : 2;
    var n = pts.length / stride;
    if (!n) return { score: 0, meanDist: 1e9, inlierFrac: 0 };
    var sig = sigma || CHAMFER_SIGMA;
    var cut = sig * 3;
    var sum = 0, dsum = 0, inl = 0;
    for (var i = 0; i < pts.length; i += stride) {
        var fx = pts[i] + dx, fy = pts[i + 1] + dy;
        var Dch = oriented ? D[pts[i + 2]] : D;
        if (fx < 0 || fy < 0 || fx > w - 1 || fy > h - 1) continue; // off-canvas: excluded, not penalized
        var x0 = fx | 0, y0 = fy | 0;
        var tx = fx - x0, ty = fy - y0;
        var x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, h - 1);
        var d00 = Dch[y0 * w + x0], d10 = Dch[y0 * w + x1];
        var d01 = Dch[y1 * w + x0], d11 = Dch[y1 * w + x1];
        var d = (d00 * (1 - tx) + d10 * tx) * (1 - ty) + (d01 * (1 - tx) + d11 * tx) * ty;
        if (d < 1.0) { dsum += d; inl++; }
        if (d < cut) {
            var u = d / sig;
            sum += Math.exp(-0.5 * u * u);
        }
    }
    return { score: sum / n, meanDist: inl ? dsum / inl : 1e9, inlierFrac: inl / n };
}

/** 4 orientation-bucket distance transforms of the layout edge bitmap.
 *  A match now requires position AND gradient direction — random organic
 *  edges (flakes, contamination) rarely satisfy both. */
function layoutOrientedDistMaps(L, w, h) {
    var buckets = [new Uint8Array(w * h), new Uint8Array(w * h),
                   new Uint8Array(w * h), new Uint8Array(w * h)];
    var y, x, i;
    for (y = 1; y < h - 1; y++) {
        for (x = 1; x < w - 1; x++) {
            i = y * w + x;
            if (!L[i]) continue;
            var gx = L[i + 1] - L[i - 1];
            var gy = L[i + w] - L[i - w];
            if (gx === 0 && gy === 0) { buckets[0][i] = 1; buckets[2][i] = 1; continue; } // line end / isolated
            var ang = Math.atan2(gy, gx);           // -pi..pi, gradient direction
            var sector = Math.round(ang / (Math.PI / 4)); // -4..4 in 45-deg units
            var b = ((sector % 4) + 4) % 4;
            buckets[b][i] = 1;
        }
    }
    return buckets.map(function (B) { return layoutDistMap(B, w, h); });
}

function scoreAt(L, w, h, pts, dx, dy, sloppy) {
    var hits = 0, n = pts.length / 2;
    for (var i = 0; i < pts.length; i += 2) {
        var x = pts[i] + dx, y = pts[i + 1] + dy;
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        var idx = y * w + x;
        if (L[idx]) { hits++; continue; }
        if (sloppy && ((x > 0 && L[idx - 1]) || (x < w - 1 && L[idx + 1]) ||
                       (y > 0 && L[idx - w]) || (y < h - 1 && L[idx + w]))) hits++;
    }
    return hits / Math.max(60, n);
}

function _sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/** Fully automatic alignment: global multi-scale search of
 *  (position, scale, rotation) maximizing Sobel-edge overlap with the layout. */
async function autoAlignMicroImage() {
    if (!microImg) return;
    if (!allFeatures.length) return;
    imgStatus('Aligning: extracting layout edges\u2026');
    await _sleep(30);

    // Region: layout bbox + margin (image may sit anywhere inside)
    var rx = Infinity, ry = Infinity, RX = -Infinity, RY = -Infinity;
    allFeatures.forEach(function (f) {
        if (f.get('isDrawn')) return;
        var e = f.getGeometry().getExtent();
        rx = Math.min(rx, e[0]); ry = Math.min(ry, e[1]);
        RX = Math.max(RX, e[2]); RY = Math.max(RY, e[3]);
    });
    var mx = (RX - rx) * 0.2 + 1, my = (RY - ry) * 0.2 + 1;
    var region = [rx - mx, ry - my, RX + mx, RY + my];
    var regionW = region[2] - region[0], regionH = region[3] - region[1];

    // ---- scale prior from the marker grid ----
    var pitchL = estimateLayoutPitch();
    var pitchP = null;
    var scales = null;
    if (pitchL) {
        pitchP = estimateImagePitch();
        if (pitchP) {
            var umPerPx0 = pitchL / pitchP;
            scales = [0.8, 0.9, 1.0, 1.11, 1.25].map(function (m) { return umPerPx0 * m; });
        }
    }
    if (!scales) {
        // log-spaced coverage fallback: high-mag局部 shots to full-chip views
        scales = [0.03, 0.045, 0.068, 0.10, 0.15, 0.23, 0.34, 0.51, 0.77, 1.15, 1.7, 2.55]
            .map(function (c) { return c * regionW / imgWUm0; });
    }

    var img = microImg.img;
    var imgWUm0 = img.naturalWidth;
    var candidates = [];
    for (var ci = 0; ci < scales.length; ci++) {
        var umPerPx = scales[ci];
        var fovW = imgWUm0 * umPerPx, fovH = img.naturalHeight * umPerPx;
        var pxPerUm = 70 / fovW;
        var canvasFits = regionW * pxPerUm <= 320;
        if (canvasFits) {
            var CW = Math.min(320, Math.max(96, Math.ceil(regionW * pxPerUm)));
            var CH = Math.max(24, Math.round(CW * regionH / regionW));
            pxPerUm = CW / regionW;
            var Lc = layoutEdgeMap(region, CW, CH);
            var Dc = layoutOrientedDistMaps(Lc, CW, CH);
            var cx0 = (region[0] + region[2]) / 2, cy0 = (region[1] + region[3]) / 2;
            var pts = imageEdgePoints(region, CW, CH, cx0, cy0, umPerPx, 0, 1600);
            if (pts.length >= 40) {
                var stepC = Math.max(2, Math.round(CW / 28));
                var sigC = Math.max(1.5, stepC * 0.8);
                var grid = [];
                for (var dy = -CH; dy <= CH; dy += stepC) {
                    for (var dx = -CW; dx <= CW; dx += stepC) {
                        grid.push({ s: scoreChamfer(Dc, CW, CH, pts, dx, dy, sigC).score, dx: dx, dy: dy });
                    }
                }
                grid.sort(function (a, b) { return b.s - a.s; });
                var peaks = [];
                var sep = stepC * 3;
                for (var gi = 0; gi < grid.length && peaks.length < 6; gi++) {
                    var g = grid[gi];
                    var ok = true;
                    for (var pj = 0; pj < peaks.length; pj++) {
                        if (Math.abs(g.dx - peaks[pj].dx) < sep && Math.abs(g.dy - peaks[pj].dy) < sep) { ok = false; break; }
                    }
                    if (ok && g.s > grid[0].s * 0.25) peaks.push(g);
                }
                peaks.forEach(function (pk) {
                    var narrow = scoreChamfer(Dc, CW, CH, pts, pk.dx, pk.dy, 1.0).score;
                    candidates.push({
                        score: narrow,
                        cx: cx0 + pk.dx / pxPerUm,
                        cy: cy0 - pk.dy / pxPerUm,
                        umPerPx: umPerPx,
                        rotDeg: 0
                    });
                });
            }
        } else {
            // TILED search: the region cannot host a ~70px image inside the
            // canvas cap. Slide a 2xFOV local window over the region at a
            // stride of ~0.6 FOV and locate the image within each tile.
            var TW = 240, TH = Math.max(24, Math.round(TW * fovH / fovW));
            var strideUm = Math.max(fovW * 0.6, 50);
            var nx = Math.ceil(regionW / strideUm), ny = Math.ceil(regionH / strideUm);
            var tileCands = [];
            for (var ty = 0; ty < ny; ty++) {
                for (var tx = 0; tx < nx; tx++) {
                    var tcx = region[0] + strideUm * (tx + 0.5);
                    var tcy = region[1] + strideUm * (ty + 0.5);
                    var tRegion = [tcx - fovW, tcy - fovH, tcx + fovW, tcy + fovH];
                    var tPxPerUm = TW / (2 * fovW);
                    var Lt = layoutEdgeMap(tRegion, TW, TH);
                    var nEdge = 0;
                    for (var le = 0; le < Lt.length; le++) nEdge += Lt[le];
                    if (nEdge < 20) continue;
                    var Dt = layoutOrientedDistMaps(Lt, TW, TH);
                    var tpts = imageEdgePoints(tRegion, TW, TH, tcx, tcy, umPerPx, 0, 1200);
                    if (tpts.length < 40) continue;
                    var stepT = Math.max(2, Math.round(TW / 24));
                    var sigT = Math.max(1.5, stepT * 0.8);
                    var bestT = -1, btx = 0, bty = 0;
                    for (var tdy = -TH; tdy <= TH; tdy += stepT) {
                        for (var tdx = -TW; tdx <= TW; tdx += stepT) {
                            var ts = scoreChamfer(Dt, TW, TH, tpts, tdx, tdy, sigT).score;
                            if (ts > bestT) { bestT = ts; btx = tdx; bty = tdy; }
                        }
                    }
                    tileCands.push({ s: bestT, cx: tcx + btx / tPxPerUm, cy: tcy - bty / tPxPerUm });
                }
            }
            tileCands.sort(function (a, b) { return b.s - a.s; });
            tileCands.slice(0, 4).forEach(function (tc) {
                candidates.push({
                    score: tc.s,
                    cx: tc.cx, cy: tc.cy,
                    umPerPx: umPerPx,
                    rotDeg: 0
                });
            });
        }
        imgStatus('Aligning: scale hypothesis ' + (ci + 1) + '/' + scales.length + '...');
        await _sleep(0);
    }

    if (!candidates.length) {
        imgStatus(null);
        reportTransform('auto-align failed: not enough image edges');
        return;
    }
    // A larger FOV sits over denser layout area and scores higher by chance;
    // on near-ties prefer the SMALLER FOV (finer scale).
    candidates.sort(function (a, b) { return (b.rank ?? b.score) - (a.rank ?? a.score); });

    // ---- refine pass: per-candidate local canvas at IMAGE resolution ----
    // The refine canvas is sized to the candidate's own field of view (not the
    // whole layout region) so a small-FOV image stays well sampled.
    imgStatus('Aligning: refining\u2026');
    await _sleep(30);
var finals = [];
    // Refine EVERY coarse candidate first: at refine resolution the metric
    // separates the true basin from alien-edge basins by a wide margin, so
    // ranking AFTER refinement is reliable (coarse scores alone are not).
    for (var t = 0; t < candidates.length; t++) {
        finals.push(refineCandidate(candidates[t], true));
        if (t % 8 === 7) { imgStatus('Aligning: screening candidates ' + (t + 1) + '/' + candidates.length + '...'); await _sleep(0); }
    }
    finals.sort(function (a, b) { return b.score - a.score; });
    var top = finals.slice(0, 3);

    // Periodic grids (pad arrays, AREFs) create false optima at wrong scale —
    // sweep a WIDE multiplicative scale range and rotations around the best
    // survivors (true scale may be far from the coarse hypothesis).
    var scaleSweepFull = [0.42, 0.48, 0.55, 0.63, 0.71, 0.79, 0.87, 0.93, 0.97, 1.0, 1.03, 1.07, 1.14, 1.24, 1.36, 1.5];
    var scaleSweepTrim = [0.79, 0.87, 0.93, 0.97, 1.0, 1.03, 1.07, 1.14];
    var rotSweep = [-8, -4, 0, 4, 8];
    for (var t2 = 0; t2 < top.length; t2++) {
        var base = top[t2];
        var scaleSweep = t2 === 0 ? scaleSweepFull : scaleSweepTrim;
        for (var si = 0; si < scaleSweep.length; si++) {
            for (var ri = 0; ri < rotSweep.length; ri++) {
                var cand2 = {
                    score: 0,
                    cx: base.cx, cy: base.cy,
                    umPerPx: base.umPerPx * scaleSweep[si],
                    rotDeg: base.rotDeg + rotSweep[ri]
                };
                var r2 = refineCandidate(cand2, true);
                if (r2.score > base.score) { base = r2; top[t2] = r2; }
            }
        }
        imgStatus('Aligning: candidate ' + (t2 + 1) + '/' + top.length + '...');
        await _sleep(0);
    }
    finals = top;
    finals.sort(function (a, b) { return b.score - a.score; });
    var bestC = finals[0];
    //
    // final polish: two-tier hill-climb (coarse perturbations first, then
    // sub-percent scale / sub-0.25-degree rotations) until convergence
    var improved = true, hcIter = 0;
    while (improved && hcIter < 9) {
        improved = false;
        hcIter++;
        var perturbs = [];
        var tier = hcIter <= 3
            ? { sc: [0.985, 0.99, 0.995, 1.005, 1.01, 1.015], rt: [-0.5, -0.25, 0.25, 0.5] }
            : { sc: [0.9975, 0.9988, 1.0012, 1.0025], rt: [-0.125, -0.0625, 0.0625, 0.125] };
        tier.sc.forEach(function (fsc) {
            perturbs.push({ score: 0, cx: bestC.cx, cy: bestC.cy,
                umPerPx: bestC.umPerPx * fsc, rotDeg: bestC.rotDeg });
        });
        tier.rt.forEach(function (frt) {
            perturbs.push({ score: 0, cx: bestC.cx, cy: bestC.cy,
                umPerPx: bestC.umPerPx, rotDeg: bestC.rotDeg + frt });
        });
        for (var pb = 0; pb < perturbs.length; pb++) {
            var r3 = refineCandidate(perturbs[pb]);
            if (r3.score > bestC.score * 1.002) { bestC = r3; improved = true; }
        }
        imgStatus('Aligning: hill-climb pass ' + hcIter + '...');
        await _sleep(0);
    }

    microImg.cx = bestC.cx;
    microImg.cy = bestC.cy;
    microImg.umPerPx = bestC.umPerPx;
    microImg.rotDeg = bestC.rotDeg;
    renderMicroLayer();
    imgStatus(null);
    if (vscode) {
        vscode.postMessage({
            type: 'imageAligned',
            fileName: microImg.name,
            cx: round2(bestC.cx), cy: round2(bestC.cy),
            umPerPx: round4(bestC.umPerPx), rotDeg: round2(bestC.rotDeg),
            edgeMatch: round4(bestC.score),
            meanEdgeDistUm: bestC.meanDistUm < 1e8 ? round4(bestC.meanDistUm) : null,
            inlierFrac: round4(bestC.inlierFrac || 0),
            imageSizePx: [img.naturalWidth, img.naturalHeight],
            fieldOfViewUm: [round2(img.naturalWidth * bestC.umPerPx), round2(img.naturalHeight * bestC.umPerPx)]
        });
    }
}

/** Local translation refinement around a candidate, using SMOOTH chamfer
 *  scoring so sub-percent scale errors keep a gradient to follow.
 *
 *  "Layout is the reference": image edge points that land far from any layout
 *  edge (2D-material flakes, contamination — present in the photo but not in
 *  the GDS) simply saturate to ~0 and cannot bias the pose; the reverse term
 *  requires layout edges inside the image footprint to be covered by image
 *  edges, so the photo cannot "hide" from large parts of the reference. */
function refineCandidate(cand, fast) {
    var img = microImg.img;
    var best = { score: -1, cx: cand.cx, cy: cand.cy, umPerPx: cand.umPerPx, rotDeg: cand.rotDeg, meanDistPx: 1e9 };
    var fovW = img.naturalWidth * cand.umPerPx;
    var fovH = img.naturalHeight * cand.umPerPx;
    var Rx = fovW * 0.85 + 5, Ry = fovH * 0.85 + 5;
    var region = [cand.cx - Rx, cand.cy - Ry, cand.cx + Rx, cand.cy + Ry];
    var FW = 384;
    var FH = Math.max(48, Math.round(FW * (region[3] - region[1]) / (region[2] - region[0])));
    var L = layoutEdgeMap(region, FW, FH);
    var D = layoutOrientedDistMaps(L, FW, FH);
    var steps = fast ? [Math.round(FW / 24), Math.round(FW / 96), 1]
                     : [Math.round(FW / 24), Math.round(FW / 96), 2, 1, 0.5];
    var pxPerUm = FW / (region[2] - region[0]);
    // edge extraction depends only on (scale, rotation) — translation is
    // applied inside the grid search, so ONE extraction serves all levels
    var pts = imageEdgePoints(region, FW, FH, cand.cx, cand.cy, cand.umPerPx, cand.rotDeg, 6000);
    if (pts.length < 90) return best; // tiny-FOV degenerate candidates have too few edges to trust
    // grid search over ABSOLUTE pixel offsets from the extraction pose
    var offX = 0, offY = 0;
    for (var st = 0; st < steps.length; st++) {
        var step = steps[st];
        var range = step * 5;
        var sigL = Math.max(0.7, step * 0.8);  // shrink kernel with the grid
        var local = { score: -1, bx: offX, by: offY, md: 1e9, inl: 0 };
        for (var dy = -range; dy <= range; dy += step) {
            for (var dx = -range; dx <= range; dx += step) {
                var ax = offX + dx, ay = offY + dy;
                var fwd = scoreChamfer(D, FW, FH, pts, ax, ay, sigL);
                var sc = fwd.score;
                if (sc > local.score) { local.score = sc; local.bx = ax; local.by = ay; local.md = fwd.meanDist; local.inl = fwd.inlierFrac; }
            }
        }
        offX = local.bx; offY = local.by;
        best.score = local.score;
        best.meanDistPx = local.md;
        best.inlierFrac = local.inl;
    }
    best.cx = cand.cx + offX / pxPerUm;
    best.cy = cand.cy - offY / pxPerUm;
    best.meanDistUm = best.meanDistPx / pxPerUm;
    return best;
}

// ============================================================
// Keep OpenLayers canvas sized to its container
// ============================================================
var _pendingFit = false;
new ResizeObserver(function() {
    var prevSize = map.getSize();
    map.updateSize();
    var newSize = map.getSize();
    // If map went from zero/near-zero to a real size, fit the view to data
    var wasTiny = !prevSize || prevSize[0] < 10 || prevSize[1] < 10;
    var nowBig = newSize && newSize[0] >= 10 && newSize[1] >= 10;
    if ((wasTiny && nowBig) || _pendingFit) {
        _pendingFit = false;
        if (allFeatures.length > 0) {
            fitView();
        }
    }
}).observe(document.getElementById('map'));

// ============================================================
// Event bindings — attached via addEventListener, because the
// webview CSP blocks inline `onclick` attributes (VS Code).
// ============================================================
(function bindToolbar() {
    var $ = function (sel) { return document.querySelector(sel); };
    var on = function (el, fn) { if (el) el.addEventListener('click', function (e) { fn(e); }); };

    on($('#run-btn'), rebuildScript);
    on($('#zoom-in-btn'), zoomIn);
    on($('#zoom-out-btn'), zoomOut);
    on($('#fit-btn'), fitView);
    on($('#copy-btn'), copyYAML);

    document.querySelectorAll('.tool-btn[data-mode]').forEach(function (btn) {
        on(btn, function () {
            var mode = btn.dataset.mode;
            if (mode === 'snap') { toggleSnap(); return; }
            if (mode === 'delete') { deleteDrawn(); return; }
            setMode(mode);
        });
    });

    on($('#img-insert-btn'), function () {
        vscode && vscode.postMessage({ type: 'insertImage' });
    });
    on($('#img-move-btn'), function () {
        if (!microImg) return;
        imgMoveMode = !imgMoveMode;
        $('#img-move-btn').classList.toggle('active', imgMoveMode);
        if (imgMoveMode) setMode('select');
    });
    on($('#img-align-btn'), function () {
        if (!microImg) return;
        autoAlignMicroImage();
    });

})();

// ============================================================
// Signal ready to extension
// ============================================================
vscode && vscode.postMessage({ type: 'webviewReady' });
</script>
